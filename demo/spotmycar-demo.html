<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0d12">
<title>Spot my car · Demo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23ffffff'/><rect x='4' y='4' width='12' height='56' rx='5' fill='%231f4aa8'/><circle cx='37' cy='29' r='13' fill='none' stroke='%23e5262d' stroke-width='6'/><line x1='46' y1='38' x2='55' y2='47' stroke='%23ff6a3d' stroke-width='7' stroke-linecap='round'/></svg>">
<style>
:root{
  --paper:#f5f3ee;--surface:#ffffff;--ink:#17171a;--muted:#6d6a64;--line:#e2ded5;
  --accent:#d3241c;--accent-ink:#ffffff;--ok:#1d7447;--warn:#a66300;--info:#2a5db0;
  --soft:#efece5;--eu:#1f4aa8;--radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9e6df;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow-x:hidden}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:15px;cursor:pointer;background:none;border:0;padding:0}
.logo i{width:14px;height:14px;background:var(--accent);border-radius:3px;display:inline-block}
.top .sp{flex:1}
.iconbtn{position:relative;background:none;border:1px solid var(--line);border-radius:999px;height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.banner{background:#fff6d6;border-bottom:1px solid #ecd98f;font-size:12px;padding:6px 16px;color:#5b4a00}
main{flex:1;padding:16px 16px 96px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button.on{color:var(--accent)}
nav.bottom button .dot{position:absolute;top:4px;left:56%;background:var(--accent);width:7px;height:7px;border-radius:9px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}
h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:default}
.row:first-child{border-top:0}
button.row,a.row{cursor:pointer;color:inherit;text-decoration:none}
.row .grow{flex:1;min-width:0}
.row .grow > span:not(.plate){display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.btn.red{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.f{display:block;margin:10px 0 4px;font-size:13px;font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--ink)}
textarea.in{min-height:80px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#bfe0cd;background:#eef8f2}
.tag.warn{color:var(--warn);border-color:#f0d6a8;background:#fff7e8}
.tag.red{color:var(--accent);border-color:#f2c4c1;background:#fdf0ef}
.tag.info{color:var(--info);border-color:#c6d5f0;background:#eef3fc}
.tag.pro{color:#fff;background:var(--ink);border-color:var(--ink)}
/* Kennzeichen */
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:5px;background:#fff;font-family:"DIN Alternate","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.06em;line-height:1;white-space:nowrap}
.plate b{background:var(--eu);color:#fff;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding:0 4px 3px;width:16px}
.plate span{padding:5px 8px;font-size:15px}
.plate.lg span{font-size:22px;padding:8px 12px}
.plate.lg b{width:22px;font-size:11px}
.search{display:flex;align-items:stretch;border:2px solid #111;border-radius:8px;background:#fff;overflow:hidden}
.search b{background:var(--eu);color:#fff;font-weight:700;font-size:11px;display:flex;align-items:flex-end;justify-content:center;width:28px;padding-bottom:6px}
.search input{flex:1;border:0;outline:none;font-family:"DIN Alternate","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:24px;letter-spacing:.06em;padding:12px 10px;text-transform:uppercase;min-width:0}
.search button{border:0;background:var(--accent);color:#fff;padding:0 16px;cursor:pointer}
/* Dreigeteiltes Suchfeld: Ort · Plakette · Buchstaben · Zahlen */
.search .pf{display:flex;align-items:center;flex:1;min-width:0;padding:0 6px 0 8px;gap:2px;background:#fff}
.search .pf input{flex:none;padding:12px 2px;text-align:center;border-radius:6px}
.search .pf input:focus{background:#eef2ff}
.search .pf input::placeholder{color:#b9bec7}
.search .pf input{font-size:22px;letter-spacing:.02em}
.citymap svg{cursor:crosshair}.destcard{margin-top:8px}.destico{font-size:22px;color:#ffd60a}.destquick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.chip{border:1px solid var(--line,#252a35);background:rgba(255,255,255,.05);color:inherit;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}.cpmap svg{width:100%;height:auto;display:block;border-radius:10px}
.badges{display:inline-flex;flex-wrap:wrap;gap:6px;margin:4px 0}.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:600}.badge.sm{padding:0 4px;background:none;font-size:12px}.badgegrid{display:grid;gap:10px}.bdg{display:flex;gap:12px;align-items:flex-start;opacity:.6}.bdg.have{opacity:1}.bico{font-size:26px;line-height:1;width:34px;text-align:center;filter:grayscale(1)}.bdg.have .bico{filter:none}.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:6px 0 2px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e5262d,#ff6a3d)}
.pwfield{position:relative}.pwfield .in{padding-right:44px}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted,#9aa3b2);padding:8px;cursor:pointer}.pweye.on{color:var(--accent,#ff453a)}
.bonusbox{border:1px solid rgba(255,196,0,.35);background:linear-gradient(135deg,rgba(255,196,0,.12),rgba(255,106,61,.08))}.bonus-amt{flex:none;font-weight:800;font-size:26px;line-height:1;padding:10px 12px;border-radius:12px;background:#ffc400;color:#111}.bonus-pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#ffc400;color:#111;font-weight:700}
.dmggrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.dmggrid .full{grid-column:1/-1}.dmggrid .in{width:100%;box-sizing:border-box;min-width:0}@media(max-width:360px){.dmggrid{grid-template-columns:1fr}}
.kzo{display:inline-flex;align-items:center;gap:6px;margin:6px 2px 0;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;line-height:1.4}.kzo:empty{display:none}.kzo b{letter-spacing:.04em}
.search .pf .po{width:4.8ch}.search .pf .pm{width:3.8ch}.search .pf .pn{width:6.2ch;margin-left:2px}
.plakette{flex:none;display:inline-block;vertical-align:middle}
.search .plakette{width:22px;height:22px;margin:0 3px}
.plate .plakette{width:.82em;height:.82em;margin:0 .12em;vertical-align:-.06em}
.thumb{width:52px;height:40px;border-radius:6px;background:var(--soft);object-fit:cover;flex:none;border:1px solid var(--line)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.coinbig{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#f5b400,#ff8a00);color:#1b1300;box-shadow:0 10px 26px rgba(245,180,0,.25)}
.coinbig .n{font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1}
.coinbig svg.i{width:44px;height:44px;stroke-width:1.8}
.steps{counter-reset:st;list-style:none;padding:0;margin:0}
.steps li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.dmg-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#1f6feb,#3b82f6);color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 8px 20px rgba(31,111,235,.3)}
.dmg-btn:hover{text-decoration:none;filter:brightness(1.05)}
.dmg-btn .ico-wrap{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
.cp{background:#000;color:#fff;border-radius:16px;border:6px solid #2a2a2e;display:grid;grid-template-columns:56px 1fr;min-height:300px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif}
.cp .side{background:#121214;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.cp .side .clock{font-size:12px;font-weight:600;margin-bottom:6px}
.cp .side button{background:none;border:0;color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;padding:6px 0;width:100%;cursor:pointer}
.cp .side button.on{color:#fff}
.cp .main{padding:8px 10px;min-width:0;display:flex;flex-direction:column}
.cp .ttl{font-size:17px;font-weight:700;padding:4px 2px 8px}
.cp .cprow{display:flex;align-items:center;gap:10px;padding:11px 6px;border-top:1px solid #2c2c2e;font-size:15px;background:none;border-left:0;border-right:0;border-bottom:0;color:#fff;text-align:left;width:100%;cursor:pointer}
.cp .cprow small{display:block;color:#8e8e93;font-size:12px;margin-top:1px}
.cp .cpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.cp .cpgrid button{background:#1c1c1e;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;cursor:pointer}
.cp .cpmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:#c7c7cc;font-size:15px;padding:10px}
.cp .cpbtn{background:#0a84ff;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
.cp .cpbtn.red{background:#ff453a}
.cpr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;flex:1;align-items:start}
.cpr svg{width:100%;height:auto;display:block}
.cpr .sweep{transform-origin:100px 100px;animation:cpspin 4s linear infinite}
@keyframes cpspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cpr .sweep{animation:none;opacity:.5}}
.cp .plate{transform:scale(.92);transform-origin:left center;color:#111}
.cp .cpnear{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid #2c2c2e;font-size:13px;color:#c7c7cc}
.cp .cpnear > b{width:18px;height:18px;border-radius:9px;background:#30d158;color:#000;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.cp .cphead{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;flex-wrap:wrap}
.cp .seg{display:flex;background:#1c1c1e;border-radius:9px;padding:2px;margin-left:auto}
.cp .seg button{background:none;border:0;color:#c7c7cc;font-weight:600;font-size:13px;padding:6px 10px;border-radius:7px;cursor:pointer}
.cp .seg button.on{background:#3a3a3c;color:#fff}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer}
.datebox{width:44px;text-align:center;border:1px solid var(--line);border-radius:8px;flex:none;overflow:hidden}
.datebox .m{background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 0}
.datebox .d{font-size:18px;font-weight:700;padding:3px 0}
.ad{border:1px dashed #c9c3b6;border-radius:var(--radius);padding:12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;background:repeating-linear-gradient(45deg,#f8f6f1,#f8f6f1 8px,#f2efe8 8px,#f2efe8 16px)}
.locked{position:relative;overflow:hidden;border-radius:var(--radius)}
.locked .veil{position:absolute;inset:0;background:rgba(245,243,238,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.hero{border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.hero .bg{height:150px;position:relative;display:flex;align-items:flex-end;padding:12px}
.hero .bg img{position:absolute;right:12px;bottom:-26px;width:120px;height:90px;object-fit:cover;border-radius:8px;border:3px solid #fff;background:var(--soft)}
.hero .body{padding:34px 14px 14px}
.bg-standard{background:linear-gradient(135deg,#efece5,#e4e0d6)}
.map{position:relative;border-radius:var(--radius);border:1px solid var(--line);background:#f3f1ea;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.msgs{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink)}
.msg small{display:block;font-size:10px;opacity:.6;margin-top:2px}
.notice{border-left:3px solid var(--info);background:#f2f6fd;padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0}
.notice.warn{border-color:var(--warn);background:#fff8ea}
.notice.red{border-color:var(--accent);background:#fdf1f0}
.notice.ok{border-color:var(--ok);background:#eff8f3}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.docs .slot{border:1px dashed #c9c3b6;border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;background:#fff}
.docs .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.docs .slot input{display:none}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx td,table.mx th{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
table.mx th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp td,.cmp th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
.cmp th{border-top:0;font-size:12px}
.cmp td:nth-child(n+2),.cmp th:nth-child(n+2){text-align:center;width:64px}
.modal-wrap{position:fixed;inset:0;background:rgba(20,20,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--paper);width:100%;max-width:430px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal .mh h3{margin:0;font-size:17px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:390px;width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--accent)}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
a{color:var(--info)}
.res-pass{color:var(--ok);font-weight:700}
.res-fail{color:var(--accent);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ================= Modernes Design ================= */
:root{
  --paper:#f3f4f7;--surface:#ffffff;--ink:#0e1116;--muted:#6b7280;--line:#eceef2;
  --accent:#e5262d;--accent2:#ff6a3d;--soft:#f1f2f5;--radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
}
body{background:radial-gradient(1200px 600px at 50% -200px,#e8eaf0,#dcdfe6);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.005em}
.app{background:var(--paper)}
header.top{background:rgba(243,244,247,.8);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:0;padding:12px 16px}
.logo{font-size:16px;letter-spacing:.18em}
/* Logo D: Wortmarke im Kennzeichen, das O ist eine Lupe */
.brand{display:inline-flex;align-items:stretch;background:#fff;border:2px solid #000;border-radius:7px;overflow:hidden;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.brand .eu{background:#1f4aa8;color:#fff;font:800 9px/1 system-ui,sans-serif;width:14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;letter-spacing:0}
.brand .w{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;color:#0b0d12;font-family:"DIN Alternate","Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.04em}
.brand .spot{display:inline-flex;align-items:center;font-size:20px}
.brand .lens{width:.78em;height:.78em;margin:0 .02em 0 .04em;overflow:visible}
.brand .my{font-size:12.5px;letter-spacing:.06em}
.brand.lg{border-width:3px;border-radius:12px}

  } else if (action === 'removeMod') {

  } else if (action === 'ban') {

  } else if (action === 'unban') {

  }

  log(a.email, 'Manuell: ' + USER_ACTIONS[action], `@${t.name}${detail ? ' · ' + detail : ''} · Grund: ${reason}`);

const DAMAGE_STATUS = { new: 'Neu', work: 'In Bearbeitung', done: 'Erledigt' };
const DAMAGE_KEEP_DAYS = 90;
function damages() { return S.damages || (S.damages = []); }
function localDay(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDay(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}.${m[2]}.${m[1]}` : ''; }
function cleanPlateText(x) { return String(x || '').toUpperCase().replace(/[^A-ZÄÖÜ0-9 -]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12); }
function phoneToWa(ph) { let d = String(ph || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '49' + d.slice(1); return d.length >= 8 && d.length <= 15 ? d : null; }
function createDamage(u, d) {
  // Alle Felder sind freiwillig – nur eine Hilfe. Geprüft wird nur, was eingetragen wurde.
  d = d || {};
  const date = String(d.date || '').trim();
  if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail('Das Datum ist ungültig.');
  if (date && date > localDay(now())) return fail('Der Schadentag darf nicht in der Zukunft liegen.');
  if (date && date < localDay(now() - 3 * 365 * DAY)) return fail('Der Schadentag liegt mehr als 3 Jahre zurück.');
  const place = String(d.place || '').replace(/\s+/g, ' ').trim().slice(0, 80);
  const opp = cleanPlateText(d.opp), own = cleanPlateText(d.own);
  const ref = String(d.ref || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (opp && opp.replace(/[^A-ZÄÖÜ0-9]/g, '').length < 3) return fail('Das Kennzeichen des Unfallgegners ist zu kurz.');
  if (own && own.replace(/[^A-ZÄÖÜ0-9]/g, '').length < 3) return fail('Dein Kennzeichen ist zu kurz.');
  const phone = String(d.phone || '').replace(/[^\d+ /()-]/g, '').trim().slice(0, 25), digits = phone.replace(/\D/g, '');
  if (digits && (digits.length < 6 || digits.length > 15)) return fail('Die Telefonnummer sieht unvollständig aus.');
  if (!date && !place && !opp && !own && !digits && !ref) return ok({ id: null });   // nichts eingetragen: nichts speichern, direkt zu WhatsApp
  const who = u ? u.id : null;
  if (damages().filter(r => r.userId === who && now() - r.at < 3600 * 1000).length >= 3) return fail('Zu viele Meldungen in kurzer Zeit. Bitte melde dich direkt per Telefon.');
  const rec = { id: uid('dmg'), at: now(), userId: who, date, place, opp, own, phone: digits ? phone : '', ref, status: 'new', doneAt: null, bonusPaid: false };
  damages().push(rec);
  const sum = [date ? fmtDay(date) : '', place].filter(Boolean).join(' · ') || 'ohne Datum und Ort';
  notifyAdmins('damage', 'Neue Unfallmeldung', sum);
  log(u ? u.email : 'Gast', 'Unfallmeldung eingegangen', sum);
  return ok({ id: rec.id });
}

function cpRadar(center, r, list, selfOn) {
  const C = 100, R = 88, k = R / r;
  const pos = p => ({ x: C + (p.lon - center.lon) * 111.32 * Math.cos(center.lat * Math.PI / 180) * k, y: C - (p.lat - center.lat) * 110.57 * k });
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Radar ${r} km, ${list.length} online in der Nähe">
    <defs><linearGradient id="cpsw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30d158" stop-opacity="0"/><stop offset="1" stop-color="#30d158" stop-opacity=".45"/></linearGradient></defs>
    <circle cx="${C}" cy="${C}" r="${R}" fill="#06140a" stroke="#1f5e33" stroke-width="1.5"/>
    ${[1, 2, 3].map(i => `<circle cx="${C}" cy="${C}" r="${R * i / 4}" fill="none" stroke="#163f24" stroke-width="1"/>`).join('')}
    <path d="M${C} ${C - R}V${C + R}M${C - R} ${C}H${C + R}" stroke="#163f24" stroke-width="1"/>
    <path class="sweep" d="M${C} ${C} L${C} ${C - R} A${R} ${R} 0 0 1 ${(C + R * Math.sin(Math.PI / 4)).toFixed(1)} ${(C - R * Math.cos(Math.PI / 4)).toFixed(1)} Z" fill="url(#cpsw)"/>
    <text x="${C + 4}" y="${C - R + 12}" font-size="9" fill="#30d158" font-family="Arial">${r} km</text>
    <text x="${C + 4}" y="${C - R / 2 + 10}" font-size="8" fill="#1f7a40" font-family="Arial">${String(r / 2).replace('.', ',')} km</text>
    ${list.map((x, i) => { const q = pos(x); return `<g><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="7" fill="#30d158"/><text x="${q.x.toFixed(1)}" y="${(q.y + 3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="middle" fill="#000" font-family="Arial">${i + 1}</text></g>`; }).join('')}
    <circle cx="${C}" cy="${C}" r="6" fill="${selfOn ? '#ff453a' : '#fff'}" stroke="#000" stroke-width="2"/>
  </svg>`;
}

      <li>Online heißt: Die Person teilt ihren Standort freiwillig. Gezeigt werden nur Fahrzeug und Kennzeichen, nie ein Name; nicht öffentliche Profile als „Privates Fahrzeug“.</li>

      <li>Sichtbar werden nur auf dem iPhone mit Zustimmung. Im Auto lässt es sich nur beenden.</li>

    </ul></div>`;
};
function igChip(handle, small) {
  if (!handle) return '';
  return `<a class="ig ${small ? 'sm' : ''}" href="https://www.instagram.com/${encodeURIComponent(handle)}/" target="_blank" rel="noopener noreferrer" aria-label="Instagram-Profil @${esc(handle)} öffnen"><span class="ico">${ic('camera', 's')}</span>Instagram · @${esc(handle)}</a>`;
}
function igLocked() { return `<span class="ig locked sm" title="Nur für verbundene Pro-Mitglieder"><span class="ico">${ic('camera', 's')}</span>Instagram ${ic('lock', 's')}</span>`; }
/* Kleines Instagram-Symbol neben dem Benutzernamen */
function igInline(viewer, o) {
  if (!o || !o.instagram) return '';
  return canSeeDetails(viewer, o) ? igChip(o.instagram, true) : igLocked();
}
function ownerDetails(viewer, o) {
  if (!o) return '';
  if (viewer && viewer.id === o.id) return '';
  const c = viewer && contactBetween(viewer.id, o.id);
  const accepted = c && c.status === 'accepted';
  if (canSeeDetails(viewer, o)) {
    if (!o.instagram) return `<p class="xs muted" style="margin-top:10px">${ic('camera', 's')} Kein Instagram hinterlegt.</p>`;
    return ''; // Instagram steht bereits als Chip neben dem Benutzernamen
  }
  if (accepted) return `<div style="margin-top:10px">${lockedBox(`<div class="card pad" style="min-height:170px"><span class="ig"><span class="ico">${ic('camera', 's')}</span>Instagram · @beispiel</span></div>`, 'Instagram')}</div>`;
  return `<p class="xs muted" style="margin-top:10px">${ic('camera', 's')} Instagram sieht nur, wer Pro hat und mit dieser Person verbunden ist.</p>`;
}
function vehicleRow(v) {
  const o = userById(v.ownerId);
  return `<button class="row" data-a="go" data-v="vehicle" data-p="${v.id}">
    ${v.photo ? `<img class="thumb" src="${esc(v.photo)}" alt="">` : `<span class="thumb" style="display:flex;align-items:center;justify-content:center">${ic('car')}</span>`}
    <span class="grow"><span class="t">${esc(v.make)} ${esc(v.model)}</span><span class="xs muted">${esc(o ? o.name : '')} ${o ? badgeChips(o, true) : ''}</span></span>

function meetRow(m) {

    <div class="grow"><div class="t">${esc(m.title)}</div><div class="xs muted">${esc(m.time)} Uhr · ${esc(m.place)}, ${m.plz ? esc(m.plz) + ' ' : ''}${esc(m.city)}${typeof m.km === 'number' ? ' · ' + fmtKm(m.km) : ''}</div></div><span class="tag red">offiziell</span></div>`;
}

VIEWS.vehicle = (u) => {
  const v = vehicleById(R.param);
  if (!v) return back('search') + '<div class="empty">Fahrzeug nicht gefunden.</div>';
  const o = userById(v.ownerId);
  const priv = u && (u.id === o.id || isStaff(u) || contactBetween(u.id, o.id));
  if (o && v.verified !== 'verified' && !priv) return back('search') + '<div class="empty">Dieses Kennzeichen ist noch nicht verifiziert und deshalb nicht öffentlich.</div>';
  if (o && o.findable === false && !priv) return back('search') + '<div class="empty">Dieses Profil ist nicht öffentlich auffindbar.</div>';
  let action = '';
  if (!u) action = `<button class="btn block" data-a="go" data-v="auth" data-t="login">Zum Kontaktieren anmelden</button>`;
  else if (v.ownerId === u.id) action = `<button class="btn ghost block" data-a="go" data-v="profile">Das ist dein Fahrzeug · Profil bearbeiten</button>`;
  else {
    const c = contactBetween(u.id, v.ownerId);
    const mine = vehicleOf(u.id);
    if (c && c.status === 'accepted') action = `<button class="btn block" data-a="go" data-v="chat" data-p="${c.id}">${ic('chat', 's')}Chat öffnen</button>`;
    else if (c && c.status === 'pending') action = `<div class="notice">${c.from === u.id ? 'Anfrage gesendet. Der Chat öffnet sich, sobald die Gegenseite zustimmt.' : 'Diese Person hat dir eine Anfrage geschickt. Antworte unter Chats.'}</div>`;
    else if (c && c.status === 'blocked') action = `<div class="notice warn">Kontakt nicht möglich.</div>`;
    else if (!mine || mine.verified !== 'verified') action = `<div class="notice warn">Chats sind erst möglich, wenn dein eigenes Kennzeichen verifiziert ist.</div><button class="btn ghost block" data-a="go" data-v="profile">Zur Verifizierung</button>`;
    else if (!isPro(u)) action = lockedBox(`<button class="btn red block" disabled>${ic('chat', 's')}Kontakt anfragen</button><div style="height:110px"></div>`, 'Chats starten');
    else if (v.verified !== 'verified') action = `<div class="notice">Dieses Kennzeichen ist noch nicht verifiziert. Kontakt ist erst danach möglich.</div>`;
    else action = `<button class="btn red block" data-a="contact" data-p="${v.id}">${ic('chat', 's')}Kontakt anfragen</button>`;
  }
  return back('search') + `
    <div class="hero"><div class="bg bg-standard">${plateHTML(v.plate, true)}${v.photo ? `<img src="${esc(v.photo)}" alt="Fahrzeugfoto">` : ''}</div>
    <div class="body"><h1 style="margin:0">${esc(v.make)} ${esc(v.model)}</h1><p class="muted small" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>${ic('user', 's')} ${esc(o ? o.name : '')}</span>${igInline(u, o)}</p><p>${verTag(v)}</p>${o ? badgeChips(o) : ''}</div></div>
    ${ownerDetails(u, o)}
    ${u && v.ownerId !== u.id ? `<p class="xs" style="text-align:right;margin:8px 2px 0"><a href="#" data-a="flagdlg" data-p="v:${v.id}">${ic('alert', 's')} Profil melden</a></p>` : ''}
    <div style="margin-top:14px">${action}</div>
    <p class="xs muted" style="margin-top:14px">Öffentlich sichtbar: Benutzername, Fahrzeug und Kennzeichen. Keine E-Mail, kein Standort.</p>`;
};

/* ---------- Stadtkarte mit Ziel (ohne Route) ----------
   Die Demo läuft ohne Internet: Die Karte wird aus den PLZ-Daten gezeichnet (Orte, PLZ-Gebiete, Treffen, Hotspots).
   In der echten App kommt hier eine echte Kartenansicht hin (z. B. Apple MapKit / Google Maps). Gezeichnet wird nie eine Route;
   „Navigation starten“ übergibt das Ziel an Apple Karten oder Google Maps. */
const NON_PLACE = /(kasse|bank|bibliothek|versicherung|verwaltung|ministerium|universit|klinik|finanzamt|agentur|rundfunk|telekom|verlag|stadtwerke|zentrale|genossenschaft|gmbh|\bag\b|\bkg\b|e\.v\.|amt\b|ämter|behörde|gericht|\bpost\b|service|center|bundes|landes|senat|staatskanzlei|firmus|versand|holding|konzern|werke?\b|\bund\b|\d|mbh|krankenhaus|staatsanwaltschaft|polizei|pharma|international|produktion|bandstahl|airtours|\bgbr\b|ltd|gesellschaft|&|,|^(stadt|kreis|der|die|magistrat|hochschule|stiftung|deutsches?|apotheke|seniorenzentrum|justizvollzugsanstalt|großannahmestelle|ministerpräsident)\b)/i;
const NON_PLACE_CAPS = /\b[A-ZÄÖÜ]{3,}\b/;
function mapPlaces(c, r) {
  const box = r * 1.45, dLat = box / 110.57, dLon = box / (111.32 * Math.cos(c.lat * Math.PI / 180)), out = [];
  for (const [plz, list] of PLZDB) {
    const p0 = list[0]; if (!p0 || Math.abs(p0.lat - c.lat) > dLat || Math.abs(p0.lon - c.lon) > dLon) continue;
    const names = list.map(x => x.ort.trim()).filter(o => o && !NON_PLACE.test(o.replace(/\b[A-ZÄÖÜ]{3,}\b/g, '')) && !NON_PLACE_CAPS.test(o) && (o.split(/\s+/).length <= 3 || (o.split(/\s+/).length === 4 && / (an der|auf dem|in der|vor der|am|im) /.test(o))));
    if (!names.length) continue;
    out.push({ plz, lat: p0.lat, lon: p0.lon, name: names[0], km: distKm(c, p0) });
  }
  return out;
}
let NAME_INDEX = null, NAME_INDEX_DB = null;
function nameIndex() {
  if (NAME_INDEX && NAME_INDEX_DB === PLZDB) return NAME_INDEX;
  NAME_INDEX = new Map(); NAME_INDEX_DB = PLZDB;
  for (const list of PLZDB.values()) for (const x of list) NAME_INDEX.set(x.ort, (NAME_INDEX.get(x.ort) || 0) + 1);
  return NAME_INDEX;
}
/* Echter Ortsname? Mehrfach vergeben = Ort. Einmalige Namen aus mehreren Wörtern nur mit typischem Ortsmuster

const TOWN_PATTERN = /^(Bad|Sankt|St\.|Groß|Klein|Alt|Neu|Ober|Unter|Nieder|Hohen|Kloster|Schloss|Burg|Markt|Hansestadt)\s|\s(am|an der|an den|im|in der|in|bei|ob|vor der|auf dem|unter|über|zu)\s|\(/;
function isTownName(n) {
  if (!/^[A-ZÄÖÜ]/.test(n) || /^(Radio|Sender|Fernsehen|Zeitung|Messe|Flughafen|Hafen|Bahnhof|Hauptbahnhof|Klinik|Kaserne)\b/i.test(n)) return false;
  const idx = nameIndex(); if ((idx.get(n) || 0) > 1) return true;
  const w = n.split(/\s+/); if (w.length === 1) return !/^(Sigma|Allianz|Siemens|Airbus|Amazon|Otto|Tchibo|Bosch|Quelle)$/i.test(n);
  return TOWN_PATTERN.test(n) || (idx.get(w[0]) || 0) > 0 || (idx.get(w[0].replace(/-.*$/, '')) || 0) > 0;
}
function mapTowns(places) {
  places = places.filter(p => isTownName(p.name));
  // Großkunden-PLZ (Firmen, Behörden) liegen meist exakt auf der Stadtmitte einer anderen PLZ: einzelne Namen dort weglassen
  const at = new Map(); for (const p of places) { const key = p.lat.toFixed(3) + ',' + p.lon.toFixed(3); at.set(key, (at.get(key) || new Set()).add(p.name)); }
  const cnt = new Map(); for (const p of places) cnt.set(p.name, (cnt.get(p.name) || 0) + 1);
  places = places.filter(p => cnt.get(p.name) > 1 || at.get(p.lat.toFixed(3) + ',' + p.lon.toFixed(3)).size === 1);
  const g = new Map();
  for (const p of places) { const k = p.name.split(/\s+/)[0] === p.name ? p.name : p.name; const t = g.get(k) || { name: k, n: 0, lat: 0, lon: 0 }; t.n++; t.lat += p.lat; t.lon += p.lon; g.set(k, t); }
  return [...g.values()].map(t => ({ name: t.name, n: t.n, lat: t.lat / t.n, lon: t.lon / t.n })).sort((a, b) => b.n - a.n);

function inGermany(lat, lon) { return isFinite(lat) && isFinite(lon) && lat > 47 && lat < 55.2 && lon > 5.5 && lon < 15.5; }
function setDest(u, d) {

/* Punkt auf der Karte → nächstgelegener Ort/PLZ als Name */

  const cosL = Math.cos(c.lat * Math.PI / 180);

  const inside = q => q.x > -10 && q.x < W + 10 && q.y > -10 && q.y < H + 10;

  const taken = [];
  const free = (x, y, w, h) => { if (x < 2 || y < 2 || x + w > W - 2 || y + h > H - 2) return false; if (taken.some(t => x < t.x + t.w && x + w > t.x && y < t.y + t.h && y + h > t.y)) return false; taken.push({ x, y, w, h }); return true; };
  free(cx - 9, cy - 9, 18, 18);

  const dots = places.map(pl => { const q = pos(pl); return inside(q) ? `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${car ? 1.6 : 2}" fill="${car ? '#2b3a4d' : '#2a3242'}"/>` : ''; }).join('');

  const meets = (opts.meets || []).map(m => { const q = pos(m); return inside(q) ? `<g><rect x="${(q.x - 6).toFixed(1)}" y="${(q.y - 6).toFixed(1)}" width="12" height="12" rx="3" fill="#ff9f0a" stroke="#0b0d12" stroke-width="1.5"/><title>Treffen: ${esc(m.title)}</title></g>` : ''; }).join('');
  const hs = (opts.hs || []).map(h => { const q = pos(h); return inside(q) ? `<g><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="7" fill="#161a22" stroke="#f2f4f8" stroke-width="1.5"/><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="2.5" fill="#f2f4f8"/><title>${esc(h.name)}</title></g>` : ''; }).join('');
  const u = opts.u;
  const live = (opts.live || []).map(x => { const q = pos(x), self = u && x.id === u.id; return inside(q) ? `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${self ? 6.5 : 5}" fill="${self ? '#ff453a' : '#4f8cff'}" stroke="#0b0d12" stroke-width="2"><title>${esc(self ? 'Du' : liveLabel(x))}</title></circle>` : ''; }).join('');
  let dest = '';
  if (opts.dest) {
    const q0 = pos(opts.dest), out = !inside(q0);
    const q = out ? (() => { const dx = q0.x - cx, dy = q0.y - cy, f = Math.min((W / 2 - 14) / Math.abs(dx || 1), (H / 2 - 14) / Math.abs(dy || 1)); return { x: cx + dx * f, y: cy + dy * f }; })() : q0;
    dest = `<g class="destpin"><path d="M${q.x.toFixed(1)} ${q.y.toFixed(1)}v-22" stroke="#ffd60a" stroke-width="2.5"/><path d="M${q.x.toFixed(1)} ${(q.y - 22).toFixed(1)}h13l-4 5 4 5h-13z" fill="#ffd60a"/><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.5" fill="#ffd60a" stroke="#0b0d12" stroke-width="1.5"/>${out ? `<text x="${q.x.toFixed(1)}" y="${(q.y + 14).toFixed(1)}" font-size="9" text-anchor="middle" fill="#ffd60a" font-family="Arial">außerhalb</text>` : ''}<title>Ziel: ${esc(opts.dest.name)}</title></g>`;
  }
  const self = `<path d="M${cx} ${cy - 8}l6 8-6 8-6-8z" fill="#f2f4f8" stroke="#0b0d12" stroke-width="1.5"/>`;
  return `<svg class="citysvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stadtkarte ${r} km um ${esc(c.ort || '')}${opts.dest ? ', Ziel ' + esc(opts.dest.name) : ''}" data-map="1" data-lat="${c.lat}" data-lon="${c.lon}" data-k="${k}" data-w="${W}" data-h="${H}">
    <rect width="${W}" height="${H}" fill="${car ? '#0b1118' : '#0f1218'}"/>
    <g stroke="${car ? '#17222f' : '#1c2230'}" stroke-width="1" fill="none">${[1, 2, 3, 4].map(i => `<circle cx="${cx}" cy="${cy}" r="${R * i / 4}"/>`).join('')}</g>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${car ? '#1f5e33' : '#d3241c'}" stroke-width="1.2" stroke-dasharray="5 4"/>
    ${dots}${plzs}${towns}${hs}${meets}${live}${dest}${self}
    <text x="${W - 6}" y="${H - 6}" font-size="9" text-anchor="end" fill="#5b6576" font-family="Arial">N ↑ · ${r} km</text>
  </svg>`;
}

VIEWS.status = () => {

  const res = T.testResults;
  const passed = res ? res.filter(r => r.pass).length : 0;
  const active = MATRIX.filter(m => m[2] !== 'off');
  const featOk = res ? active.filter(([n]) => res.filter(r => r.f === n).every(r => r.pass)).length : 0;
  return back('profile') + `<h1>Status</h1>
    <p class="small muted">Was in dieser Demo echt funktioniert, was simuliert ist und was fehlt.</p>
    <h2>Selbsttest</h2>
    <div class="card pad">
      <p class="small">Läuft auf einer frischen Kopie der Beispieldaten. Deine aktuellen Demo-Daten bleiben unverändert.</p>
      <button class="btn red block" data-a="selftest">${ic('flask', 's')}Selbsttest starten</button>
      ${res ? `<p style="margin-top:10px"><b>${passed} von ${res.length}</b> Prüfschritten bestanden · <b>${featOk} von ${active.length}</b> Funktionen ohne Fehler</p>
        <table class="mx"><tbody>${res.map(r => `<tr><td class="xs muted">${r.f}</td><td>${esc(r.name)}${r.err ? `<div class="xs res-fail">${esc(r.err)}</div>` : ''}</td><td class="${r.pass ? 'res-pass' : 'res-fail'}">${r.pass ? 'OK' : 'FEHLER'}</td></tr>`).join('')}</tbody></table>` : ''}
    </div>
    <h2>Funktionsmatrix</h2>
    <div class="card pad"><table class="mx"><thead><tr><th>#</th><th>Funktion</th><th>Status</th></tr></thead><tbody>
      ${MATRIX.map(([n, name, st, note]) => `<tr><td>${n}</td><td><b>${esc(name)}</b><div class="xs muted">${esc(note)}</div></td><td>${lbl[st]}</td></tr>`).join('')}

    <div class="card pad small">${LAUNCH.map(([h, items]) => `<p style="margin:8px 0 4px"><b>${esc(h)}</b></p><ul style="margin:0 0 6px;padding-left:18px">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>
    <h2>Nicht implementiert</h2>
    <div class="card pad"><ul class="small" style="margin:0;padding-left:18px">${NOT_IMPL.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>

    <p class="xs muted" style="margin-top:12px">Lokale Datei, keine Netzwerkzugriffe. Nicht zur Veröffentlichung bestimmt.</p>`;
};

/* ---------- Modals und Meldungen ---------- */
function modal(title, html) {
  closeModal();
  const w = document.createElement('div');
  w.className = 'modal-wrap'; w.id = 'modal';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="iconbtn" data-a="closemodal" aria-label="Schließen">${ic('x', 's')}</button></div>${html}</div>`;
  w.addEventListener('click', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w);
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.remove(); }
let toastTimer;
function toast(msg, err) {
  let t = document.querySelector('.toast'); if (t) t.remove();
  t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function result(r, okMsg) { if (!r.ok) { toast(r.msg, true); return false; } if (okMsg) toast(okMsg); save(); return true; }

    case 'approvevid': { const rs = (document.getElementById('ua_reason') || {}).value; if (result(adminManualApprove(u, p, rs), 'Ohne Fahrzeugschein verifiziert und protokolliert')) { closeModal(); render(); } break; }
    case 'togglepw': { const f = el.closest('form'); const show = f.querySelector('input[name=pw]').type === 'password'; f.querySelectorAll('input[name=pw],input[name=pw2]').forEach(i => i.type = show ? 'text' : 'password'); el.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen'); el.classList.toggle('on', show); break; }
    case 'dmgbonus': if (result(markBonusPaid(u, p), 'Prämie aktualisiert')) render(); break;
    case 'flagdecide': { const note = (document.getElementById('fnote_' + p) || {}).value; if (result(resolveFlag(u, p, el.dataset.y, note), 'Entschieden und protokolliert')) render(); break; }
    case 'canceldlg': modal('Vertrag kündigen', `

    case 'endsub': if (confirm('Pro sofort beenden? (Demo, keine Erstattung simuliert)')) { if (result(endSubNow(u), 'Abo beendet. Konto ist jetzt Basic.')) render(); } break;
    case 'resetback': T.resetSent = null; T.resetMail = null; render(); break;
    case 'openresetlink': closeModal(); T.resetToken = p; T.resetSent = null; T.resetMail = null; go('auth', null, 'reset'); break;
    case 'selftest': { T.testResults = runSelfTest(); housekeeping(); render(); const f = T.testResults.filter(r => !r.pass).length; toast(f ? `${f} Prüfschritte fehlgeschlagen` : 'Alle Prüfschritte bestanden', !!f); break; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;

    case 'login': { const r = login(d.email, d.pw); if (r.ok && r.twoFactor) { go('auth', null, '2fa'); break; } if (result(r, 'Willkommen zurück')) go('search'); break; }

    case 'wa': if (result(setWhatsapp(u, d.num), 'Gespeichert')) render(); break;

    case 'damage': { const r = createDamage(u, d); if (result(r, r.id ? 'Angaben gespeichert' : '')) { T.dmgDone = r.id || 'none'; render(); } break; }
    case 'alerts': if (result(setAdminAlerts(u, d), 'Benachrichtigungen gespeichert')) render(); break;
    case 'adminphone': if (result(setAdminPhone(u, d.phone, d.pw), 'Handynummer geändert')) render(); break;
    case 'config': if (result(setConfig(u, d), 'Einstellungen gespeichert und protokolliert')) render(); break;
    case 'gmsg': if (result(postGroup(u, d.text))) render(); break;
    case 'userq': T.userQ = String(d.q || '').trim(); render(); break;
    case 'legal': if (result(setLegal(u, d), 'Rechtliche Angaben gespeichert')) render(); break;
  }
});
document.addEventListener('input', e => {
  const f = e.target.closest('[data-plate]'); if (!f) return;
  const rule = { o: [/[^A-ZÄÖÜ]/g, 3], m: [/[^A-Z]/g, 2], n: [/[^0-9EH]/g, 5] }[f.dataset.plate];
  const raw = f.value.toUpperCase();
  // Ziffern im Ort- oder Buchstabenfeld wandern ins Zahlenfeld
  if (f.dataset.plate !== 'n' && /\d/.test(raw)) {
    const nf = f.form.querySelector('[data-plate="n"]');
    f.value = raw.replace(rule[0], '').slice(0, rule[1]);
    nf.value = (nf.value + raw.replace(/\D/g, '')).slice(0, 5); nf.focus(); return;
  }
  const v = raw.replace(rule[0], '').slice(0, rule[1]);
  if (v !== f.value) f.value = v;
  if (f.dataset.plate === 'o') { const h = document.getElementById('kzo'); if (h) h.innerHTML = originHint(v); }
  const next = { o: 'm', m: 'n' }[f.dataset.plate];
  if (next && v.length >= rule[1]) { const nx = f.form.querySelector(`[data-plate="${next}"]`); if (nx) nx.focus(); }
});
document.addEventListener('keydown', e => {
  const f = e.target.closest && e.target.closest('[data-plate]'); if (!f) return;
  const prev = { m: 'o', n: 'm' }[f.dataset.plate], next = { o: 'm', m: 'n' }[f.dataset.plate];
  if (e.key === 'Backspace' && !f.value && prev) { e.preventDefault(); f.form.querySelector(`[data-plate="${prev}"]`).focus(); }
  if (e.key === ' ' || e.key === '-') { e.preventDefault(); if (next && f.value) f.form.querySelector(`[data-plate="${next}"]`).focus(); }
});
document.addEventListener('change', async e => {
  const txt = e.target.closest('[data-text]');
  if (txt && txt.files[0]) {
    const f = txt.files[0];
    if (f.size > 30 * 1024 * 1024) { toast('Datei zu groß (max. 30 MB).', true); return; }
    toast('PLZ-Datei wird gelesen …');
    const r = importPlz(await f.text());
    if (!r.ok) { toast(r.msg, true); return; }
    closeModal(); if (T.radar) setRadar(T.radar.plz, T.radar.r); render();
    toast(`${r.count.toLocaleString('de-DE')} Postleitzahlen geladen${r.stored ? '' : ' (nur bis zum Neuladen, Browser-Speicher voll)'}`);
    return;
  }
  const inp = e.target.closest('[data-file]'); if (!inp || !inp.files[0]) return;
  try { T[inp.dataset.file] = await readImage(inp.files[0]); render(); }
  catch (err) { toast(err.message, true); }
});
function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Bitte eine Bilddatei wählen.'));
    if (file.size > 20 * 1024 * 1024) return rej(new Error('Bild ist zu groß (max. 20 MB).'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('Datei konnte nicht gelesen werden.'));
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 640, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden.'));
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
